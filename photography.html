<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason Campbell - Photography</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">MC</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="resume.html" class="nav-link">Resume</a></li>
                <li><a href="writing.html" class="nav-link">Writing</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="photography.html" class="nav-link active">Photography</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <h1 class="page-title">Photography</h1>

        <div class="gallery-grid">
            <div class="gallery-item wide">
                <img src="Images/1.JPG" alt="Photo 1">
            </div>
            <div class="gallery-item">
                <img src="Images/10.jpg" alt="Photo 2">
            </div>
            <div class="gallery-item tall">
                <img src="Images/12.jpg" alt="Photo 3">
            </div>
            <div class="gallery-item">
                <img src="Images/11.jpg" alt="Photo 4">
            </div>
            <div class="gallery-item">
                <img src="Images/13.jpg" alt="Photo 5">
            </div>
            <div class="gallery-item wide">
                <img src="Images/15.jpeg" alt="Photo 6">
            </div>
            <div class="gallery-item">
                <img src="Images/2.jpg" alt="Photo 7">
            </div>
            <div class="gallery-item">
                <img src="Images/3.JPG" alt="Photo 8">
            </div>
            <div class="gallery-item tall">
                <img src="Images/4.JPG" alt="Photo 9">
            </div>
            <div class="gallery-item">
                <img src="Images/6.JPG" alt="Photo 10">
            </div>
            <div class="gallery-item">
                <img src="Images/8.JPG" alt="Photo 11">
            </div>
            <div class="gallery-item">
                <img src="Images/9.JPG" alt="Photo 12">
            </div>
        </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Mason Campbell. All rights reserved.</p>
    </footer>

    <script>
        // Lightbox functionality
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                lightboxImg.src = item.src;
                lightbox.classList.add('active');
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        // Close lightbox on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Close lightbox with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
